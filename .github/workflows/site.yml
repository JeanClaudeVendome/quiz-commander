name: Site et données

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # chaque lundi matin : nouvelles cartes, légalités, prix, combos
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Lundi (ou à la main) : reconstruire les données, vérifier le moteur, puis enregistrer.
  data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Construire les données (Scryfall, Commander Spellbook, MTGJSON)
        run: python scripts/build_data.py
      - name: Audit du quiz et tests du moteur (rien n'est publié s'ils échouent)
        run: |
          node scripts/audit.js
          node scripts/tests/lancer.js
      - name: Enregistrer les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/commanders.json data/types.json data/report.json data/cache
          git diff --cached --quiet || git commit -m "Données du $(date -u +%F)"
          git push

  # À chaque modification du site : vérifier le moteur avant de publier.
  tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit du quiz et tests du moteur
        run: |
          node scripts/audit.js
          node scripts/tests/lancer.js

  deploy:
    needs: [data, tests]
    if: always() && (needs.data.result == 'success' || needs.data.result == 'skipped') && (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
