<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le quiz — Le grand quiz Commander</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site/style.css">
<style>
body{background:var(--night)}
/* ---------- Scène ---------- */
.stage{position:relative;min-height:100vh;color:#fff;overflow:hidden;display:flex;flex-direction:column}
.bg{position:absolute;inset:-30px;background:var(--night) center 30%/cover no-repeat;filter:blur(6px) saturate(.9);transform:scale(1.05);transition:opacity .6s}
.stage::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 30%,rgba(18,15,24,.55),rgba(18,15,24,.92) 70%)}
.stage>*:not(.bg){position:relative;z-index:2}

/* ---------- Barre de progression ---------- */
.top{padding:86px 20px 0;max-width:820px;margin:0 auto;width:100%}
.chap{display:flex;justify-content:space-between;align-items:baseline;font-family:Cinzel,serif;font-size:.78rem;letter-spacing:.14em;color:var(--gold-l)}
.chap span:last-child{color:#A89FB5;letter-spacing:.06em;font-family:Lato,sans-serif}
.bar{height:3px;background:rgba(255,255,255,.12);margin-top:8px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold-l);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar b{position:absolute;top:-3px;width:9px;height:9px;transform:translateX(-4px) rotate(45deg);background:var(--gold-l);transition:left .5s cubic-bezier(.2,.8,.2,1)}

/* ---------- Écran ---------- */
.screen{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:820px;width:100%;margin:0 auto;padding:30px 20px 40px}
.screen.in{animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.q{font-family:Cinzel,serif;font-weight:700;font-size:clamp(1.5rem,4.2vw,2.3rem);line-height:1.2;margin:0 0 8px;text-wrap:balance}
.help{color:#B9B0C6;margin:0 0 26px}

/* Réponses simples */
.opts{display:grid;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:center;padding:14px 16px;border:1px solid #4A4058;background:rgba(255,255,255,.035);transition:border-color .15s,background .15s,transform .15s;min-height:56px}
.opt:hover{border-color:#8A7D9A;background:rgba(255,255,255,.06)}
.opt:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}
.opt .k{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:.85rem;border:1px solid #5A4E68;transform:rotate(45deg)}
.opt .k span{transform:rotate(-45deg)}
.opt small{display:block;color:#A89FB5;font-size:.85rem;margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--gold-l);background:rgba(233,215,174,.1)}
.opt[aria-pressed="true"] .k{background:var(--gold-l);color:var(--night);border-color:var(--gold-l)}

/* Choix illustrés (personnages) */
.arts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.art{all:unset;box-sizing:border-box;cursor:pointer;position:relative;aspect-ratio:4/3;background:#2A2033 center/cover;border:1px solid #4A4058;overflow:hidden;transition:transform .2s,border-color .2s}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(18,15,24,.95))}
.art:hover{transform:translateY(-3px);border-color:#8A7D9A}
.art:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}
.art .t{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:12px}
.art b{font-family:Cinzel,serif;font-size:1rem;display:block;line-height:1.2}
.art small{color:#C9C0D5;font-size:.78rem;line-height:1.3;display:block;margin-top:4px}
.art[aria-pressed="true"]{border:2px solid var(--gold-l)}
.art .tick{position:absolute;top:10px;right:10px;z-index:2;width:26px;height:26px;transform:rotate(45deg);background:var(--gold-l);display:none}
.art[aria-pressed="true"] .tick{display:block}
.count{font-size:.85rem;color:var(--gold-l);margin-top:12px}

/* Dilemme */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0;position:relative;min-height:340px}
.side{all:unset;box-sizing:border-box;cursor:pointer;position:relative;background:#2A2033 center/cover;display:flex;align-items:flex-end;padding:20px;overflow:hidden;transition:filter .25s}
.side::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(18,15,24,.92))}
.side b{position:relative;z-index:2;font-family:Cinzel,serif;font-size:clamp(1.05rem,2.5vw,1.35rem);line-height:1.25}
.pair:hover .side:not(:hover){filter:brightness(.55) saturate(.6)}
.side:focus-visible{outline:2px solid var(--gold-l);outline-offset:-2px}
.side[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--gold-l)}
.pair .or{position:absolute;left:50%;top:50%;z-index:3;width:58px;height:58px;transform:translate(-50%,-50%) rotate(45deg);background:var(--night);border:1px solid var(--gold-l);display:flex;align-items:center;justify-content:center;pointer-events:none}
.pair .or span{transform:rotate(-45deg);font-family:Cinzel,serif;font-weight:700;color:var(--gold-l)}

/* Échelle */
.scale{padding:30px 0 10px}
.track{position:relative;display:flex;justify-content:space-between;align-items:center;margin:0 10px}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,#5A4E68,var(--gold),#5A4E68)}
.dot{all:unset;cursor:pointer;position:relative;width:26px;height:26px;transform:rotate(45deg);border:1px solid #8A7D9A;background:var(--night);transition:all .2s}
.dot:nth-child(3){width:20px;height:20px}
.dot:hover{border-color:var(--gold-l)}
.dot:focus-visible{outline:2px solid var(--gold-l);outline-offset:4px}
.dot[aria-pressed="true"]{background:var(--gold-l);border-color:var(--gold-l);width:34px;height:34px;box-shadow:0 0 0 6px rgba(233,215,174,.15)}
.ends{display:flex;justify-content:space-between;gap:30px;margin-top:22px;font-family:Cinzel,serif;font-size:.95rem}
.ends span{max-width:40%}
.ends span:last-child{text-align:right}

/* Coup d'œil */
.swipe{display:flex;flex-direction:column;align-items:center}
.deck{position:relative;width:min(300px,76vw);aspect-ratio:488/680;margin:6px 0 22px}
.card{position:absolute;inset:0;border-radius:4.5%/3.2%;background:#2A2033 center/cover;box-shadow:0 20px 40px rgba(0,0,0,.5);touch-action:none;cursor:grab;user-select:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
.card.under{transform:scale(.94) translateY(14px);filter:brightness(.6)}
.card.drag{transition:none;cursor:grabbing}
.stamp{position:absolute;top:18px;padding:4px 12px;font-family:Cinzel,serif;font-weight:800;font-size:1.3rem;border:3px solid;transform:rotate(-12deg);opacity:0;background:rgba(18,15,24,.6)}
.stamp.like{left:14px;color:#8FD9A8}
.stamp.nope{right:14px;color:#F0A49A;transform:rotate(12deg)}
.react{display:flex;gap:18px}
.rb{all:unset;cursor:pointer;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;border:1px solid #5A4E68;background:rgba(255,255,255,.04);transition:transform .15s,border-color .15s}
.rb:hover{transform:scale(1.08)}
.rb:focus-visible{outline:2px solid var(--gold-l);outline-offset:3px}
.rb.no{color:#F0A49A}.rb.no:hover{border-color:#F0A49A}
.rb.meh{color:#C9C0D5;width:50px;height:50px;font-size:1.1rem;align-self:center}
.rb.yes{color:#8FD9A8}.rb.yes:hover{border-color:#8FD9A8}
.react{align-items:flex-start;gap:6px}
.rc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;width:96px;height:96px;font-size:.78rem;color:#A89FB5}

/* Couleurs */
.cgrid{display:grid;gap:8px}
.crow{display:grid;grid-template-columns:40px 110px 1fr 40px;gap:12px;align-items:center;padding:10px 12px;border:1px solid #3A3047;background:rgba(255,255,255,.03)}
.crow img{width:32px;height:32px}
.crow b{font-family:Cinzel,serif}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lv button{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font-size:.82rem;padding:8px 4px;border:1px solid #4A4058;color:#C9C0D5}
.lv button:hover{border-color:#8A7D9A}
.lv button:focus-visible,.star:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}
.lv button[aria-pressed="true"]{background:var(--gold-l);border-color:var(--gold-l);color:var(--night);font-weight:700}
.lv button.never[aria-pressed="true"]{background:#E27E72;border-color:#E27E72}
.star{all:unset;cursor:pointer;font-size:1.4rem;color:#5A4E68;text-align:center}
.star[aria-pressed="true"]{color:var(--gold-l)}

/* Pied */
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:30px}
.link{all:unset;cursor:pointer;color:#B9B0C6;font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:#fff}
.link:focus-visible{outline:2px solid var(--gold-l);outline-offset:3px}
.btn[disabled]{opacity:.35;pointer-events:none}

/* Chapitre */
.chapter{text-align:center;align-items:center}
.chapter .num{font-family:Cinzel,serif;font-weight:800;font-size:clamp(4rem,14vw,8rem);line-height:1;color:transparent;-webkit-text-stroke:1px var(--gold-l)}
.chapter h1{font-family:Cinzel,serif;font-weight:800;font-size:clamp(2rem,6vw,3.6rem);margin:6px 0 0;line-height:1.05}
.chapter p{color:#CFC6DA;max-width:46ch;margin:16px auto 30px}
.chapter .orn{color:var(--gold-l)}

/* Révélation */
.reveal{text-align:center;align-items:center}
.reveal .load{font-family:Cinzel,serif;letter-spacing:.2em;color:var(--gold-l);font-size:.85rem}
.reveal .rhex{width:min(340px,80vw);margin:6px auto 0}
.reveal .rtitle{opacity:0;transform:translateY(10px);transition:all .8s}
.reveal .rtitle.on{opacity:1;transform:none}
.reveal .rtitle small{font-family:Cinzel,serif;letter-spacing:.2em;color:var(--gold-l);font-size:.8rem}
.reveal .rtitle h1{font-family:Cinzel,serif;font-weight:800;font-size:clamp(2.2rem,7vw,4rem);margin:4px 0 0;line-height:1}
.reveal .rtitle p{color:#CFC6DA;margin:8px 0 0}
.rcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%;max-width:640px;margin:30px auto 0}
.flip{perspective:900px}
.flip .in{position:relative;aspect-ratio:488/680;transition:transform .9s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:4.5%/3.2%;overflow:hidden}
.flip .b{background:radial-gradient(circle at 50% 45%,#3A2840,#120F18 75%);border:5px solid #0B090E;display:flex;align-items:center;justify-content:center}
.flip .b svg{width:55%}
.flip .f{transform:rotateY(180deg);background:#222 center/cover}
.flip .f img{width:100%;height:100%;object-fit:cover;display:block}
.flip .cap{font-family:Cinzel,serif;font-size:.78rem;color:var(--gold-l);margin-top:8px;opacity:0;transition:opacity .6s .5s}
.flip.on .cap{opacity:1}
.flip.mid .in{box-shadow:0 0 0 2px var(--gold-l),0 16px 40px rgba(0,0,0,.6);border-radius:4.5%/3.2%}
.after{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px;opacity:0;transition:opacity .8s}
.after.on{opacity:1}
.demo{font-size:.78rem;color:#8E86A0;margin-top:14px}

.short{display:none}
@media (hover:none),(max-width:640px){.kbd{display:none}}
@media (max-width:640px){
  .long{display:none}.short{display:inline}
  .top{padding-top:76px}
  .screen{padding:24px 16px 70px;justify-content:flex-start}
  .help{margin-bottom:18px}
  .arts{grid-template-columns:1fr;gap:8px}
  .art{aspect-ratio:auto;height:96px;background-size:auto 100%;background-position:left center}
  .art::after{background:linear-gradient(90deg,rgba(18,15,24,0) 0%,rgba(18,15,24,.85) 34%,rgba(18,15,24,.97) 48%)}
  .art .t{top:0;left:40%;display:flex;flex-direction:column;justify-content:center;padding:10px 40px 10px 4px}
  .art small{margin-top:2px}
  .art .tick{top:50%;margin-top:-13px;right:14px}
  .opt{padding:12px;gap:12px}
  .foot{margin-top:24px}
  .ends{font-size:.85rem}
  .deck{width:min(260px,68vw)}
  .pair{grid-template-columns:1fr;min-height:0}.side{min-height:190px}
  .pair .side:first-child{align-items:flex-start}
  .pair .side:first-child::after{background:linear-gradient(0deg,transparent 30%,rgba(18,15,24,.92))}
  .pair .or{width:46px;height:46px}
  .crow{grid-template-columns:32px 1fr 34px;grid-template-areas:"i n s" "l l l"}
  .crow img{grid-area:i;width:28px;height:28px}.crow b{grid-area:n}.crow .star{grid-area:s}.crow .lv{grid-area:l}
  .rcards{gap:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
<style>
/* ---------- Compléments du site réel ---------- */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:26px}
.mode{all:unset;box-sizing:border-box;cursor:pointer;padding:22px;border:1px solid #4A4058;background:rgba(255,255,255,.035);transition:border-color .2s,transform .2s}
.mode:hover{border-color:var(--gold-l);transform:translateY(-3px)}
.mode:focus-visible{outline:2px solid var(--gold-l);outline-offset:3px}
.mode b{font-family:Cinzel,serif;font-size:1.4rem;display:block}
.mode small{display:block;color:var(--gold-l);font-family:Cinzel,serif;letter-spacing:.1em;font-size:.75rem;margin:4px 0 10px}
.mode span{color:#CFC6DA;font-size:.92rem}
.reprise{margin-top:22px;padding:14px 16px;border:1px dashed #5A4E68;color:#CFC6DA;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.side.noart{background:linear-gradient(160deg,#2E2438,#1A1520)}
.opt.multi .k{border-radius:3px;transform:none}.opt.multi .k span{transform:none}
.count{font-size:.85rem;color:var(--gold-l);margin-top:12px}
.grow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid #3A3047;background:rgba(255,255,255,.03)}
.grow b{font-family:Cinzel,serif;display:block}
.grow small{color:#A89FB5;font-size:.82rem;line-height:1.35;display:block}
.grows{display:grid;gap:8px}
.lv4{display:grid;grid-template-columns:repeat(4,minmax(64px,1fr));gap:6px}
.lv4 button{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font-size:.78rem;padding:8px 4px;border:1px solid #4A4058;color:#C9C0D5;min-height:38px;display:flex;align-items:center;justify-content:center}
.lv4 button:hover{border-color:#8A7D9A}
.lv4 button:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}
.lv4 button[aria-pressed="true"]{background:var(--gold-l);border-color:var(--gold-l);color:var(--night);font-weight:700}
.lv4 button.neg[aria-pressed="true"]{background:#E27E72;border-color:#E27E72}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-b{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 14px;border:1px solid #4A4058;border-radius:30px;font-size:.9rem;color:#E9E4EF;min-height:38px}
.chip-b:hover{border-color:#8A7D9A}
.chip-b:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}
.chip-b[aria-pressed="true"]{background:var(--gold-l);border-color:var(--gold-l);color:var(--night);font-weight:700}
.search{position:relative;margin:14px 0}
.search input{width:100%;font:inherit;background:rgba(255,255,255,.06);border:1px solid #5A4E68;color:#fff;padding:12px 14px;outline:none;min-height:46px}
.search input:focus{border-color:var(--gold-l)}
.sugg{list-style:none;margin:0;padding:0;border:1px solid #4A4058;border-top:0;background:#1C1724;max-height:300px;overflow:auto}
.sugg li button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;width:100%;padding:8px 12px;border-bottom:1px solid #2E2638}
.sugg li button:hover,.sugg li button:focus-visible{background:rgba(233,215,174,.1)}
.sugg .mini{width:44px;height:32px;background:#2A2033 center/cover;flex:none}
.sugg small{color:#A89FB5;display:block;font-size:.78rem}
.picked{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.picked span{display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border:1px solid var(--gold-l);border-radius:30px;font-size:.88rem}
.picked button{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;background:#3A3047;display:flex;align-items:center;justify-content:center}
.avatars{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.avatars button{all:unset;cursor:pointer;width:64px;height:64px;border-radius:50%;background:#2A2033 center/cover;box-shadow:0 0 0 2px var(--night),0 0 0 3px #5A4E68}
.avatars button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--night),0 0 0 5px var(--gold-l)}
.avatars button:focus-visible{outline:2px solid var(--gold-l);outline-offset:6px}
.contra{color:var(--gold-l);font-style:italic;margin-top:8px}
.err{color:#F0A49A;font-size:.9rem;min-height:1.2em;margin-top:10px;text-align:center}
.fine{font-size:.8rem;color:#A89FB5;margin-top:8px}
</style>
</head>
<body>
<div id="nav"></div>
<main class="stage">
  <div class="bg" id="bg"></div>
  <div class="top" id="top" style="visibility:hidden"><div class="chap"><span id="chapName"></span><span id="qnum"></span></div><div class="bar"><i id="barI"></i><b id="barB"></b></div></div>
  <section class="screen" id="screen" aria-live="polite"><div class="chargement">CHARGEMENT…</div></section>
</main>

<script src="site/i18n.js"></script><script src="site/en.js"></script>
<script src="moteur/reglages.js"></script><script src="moteur/questions.js"></script><script src="moteur/mesure.js"></script><script src="moteur/match.js"></script><script src="moteur/propositions.js"></script>
<script src="site/config.js"></script><script src="site/stockage.js"></script><script src="site/commun.js"></script><script src="site/quiz-textes.js"></script>
<script src="site/quiz.js"></script>
</body>
</html>
