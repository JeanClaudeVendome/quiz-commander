<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les joueurs — Le grand quiz Commander</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site/style.css">
<style>
.hero{position:relative;height:min(56vh,460px);min-height:340px;overflow:hidden;background:var(--night) center 35%/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,15,24,.6),rgba(18,15,24,.35) 40%,rgba(18,15,24,.9))}
.hero-txt{position:absolute;left:0;right:0;bottom:80px;z-index:2;text-align:center;color:#fff;padding:0 16px}
.hero h1{font-family:Cinzel,serif;font-weight:800;font-size:clamp(2.6rem,8vw,5.5rem);margin:0;line-height:1}
.hero .sub{font-family:Cinzel,serif;letter-spacing:.18em;color:var(--gold-l);font-size:.9rem;margin-top:8px}
.hero .orn{color:var(--gold-l)}

/* ---------- Hexagone du groupe ---------- */
.ghex{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;padding:20px 0 10px}
.ghex .big svg{width:100%;max-width:440px;display:block;margin:0 auto}
.who{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.who button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:30px;font-size:.88rem;background:#fff}
.who button span{width:26px;height:26px;border-radius:50%;background:#222 center/cover}
.who button[aria-pressed="true"]{border-color:var(--plum);background:var(--plum);color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.stat{border-top:1px solid var(--gold);padding-top:10px}
.stat small{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:Cinzel,serif;font-size:1.15rem;color:var(--plum)}
.hint{font-size:.85rem;color:var(--muted)}
.stats{grid-template-columns:1fr 1fr}
.stat b.zero{color:#B8AEB9}
.pct.zero{color:#6E6475}
.pc.empty .art{background:radial-gradient(circle at 50% 40%,#3A2840,#1F1424 75%)}
.pc.empty .art::after{display:none}
.pc .bigini{position:absolute;left:18px;top:6px;font-family:Cinzel,serif;font-weight:800;font-size:5.5rem;line-height:1.3;color:rgba(233,215,174,.22)}
.cmp-empty .pic{font-size:3rem}

/* ---------- Cartes des joueurs ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px;padding:20px 0 10px}
.pc{display:block;text-decoration:none;background:#fff;box-shadow:0 8px 24px rgba(40,20,40,.12);transition:transform .2s,box-shadow .2s;position:relative}
.pc:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(40,20,40,.2)}
.pc .art{height:150px;background:#222 center 25%/cover;position:relative}
.pc .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--t) 100%);opacity:.9}
.pc .mh{position:absolute;right:10px;bottom:-34px;width:84px;height:84px;background:#fff;border-radius:50%;z-index:2;padding:4px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.pc .body{padding:14px 16px 16px}
.pc b{font-family:Cinzel,serif;font-size:1.3rem;display:block}
.pc .t{font-size:.8rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.pc .phare{margin-top:12px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.pc .phare strong{color:var(--ink);font-weight:700}
.pc time{display:block;font-size:.75rem;color:var(--gold);margin-top:4px}

/* ---------- Comparaison ---------- */
.cmp{background:var(--night);color:#E9E4EF;position:relative;padding:70px 0 80px;margin-top:60px}
.cmp .section-title{padding-top:20px}
.cmp .section-title h2{color:#fff}
.cmp .section-title p{color:#B9B0C6}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;max-width:900px;margin:20px auto 0}
.side{text-align:center}
.side .pic{width:140px;height:140px;border-radius:50%;margin:0 auto 12px;background:#222 center/cover;box-shadow:0 0 0 3px var(--night),0 0 0 5px var(--gold)}
.side select{font:inherit;font-family:Cinzel,serif;background:transparent;color:#fff;border:1px solid #4A4058;padding:6px 10px}
.side select option{color:#000}
.score{text-align:center}
.score .pct{font-family:Cinzel,serif;font-size:3.6rem;font-weight:800;color:var(--gold-l);line-height:1}
.score small{letter-spacing:.14em;font-size:.72rem;color:#B9B0C6}
.score svg{width:180px;display:block;margin:8px auto}
.verdict{display:grid;grid-template-columns:1fr 1fr;gap:30px;max-width:900px;margin:30px auto 0}
.verdict h3{font-family:Cinzel,serif;font-size:1rem;color:var(--gold-l);margin:0 0 6px}
.verdict ul{margin:0;padding-left:18px;color:#D8D0E2}

@media (max-width:760px){
  .ghex,.verdict{grid-template-columns:1fr}
  .duel{grid-template-columns:1fr}
}
</style>
<style>
.filtres{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:10px;margin:30px 0 10px}
.filtres input,.filtres select{font:inherit;padding:10px 12px;border:1px solid var(--line);background:#fff;min-height:44px;width:100%}
.coulf{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px;align-items:center}
.coulf button{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid transparent;opacity:.55}
.coulf button img{width:28px;height:28px}
.coulf button[aria-pressed="true"]{border-color:var(--gold);opacity:1}
.coulf button:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.coulf small{color:var(--muted);margin-right:6px}
.compte{color:var(--muted);font-size:.9rem;margin:6px 0 0}
.pc .groupes{margin-top:8px}
@media (max-width:760px){.filtres{grid-template-columns:1fr 1fr}.filtres input{grid-column:1/-1}}
</style>
</head>
<body>
<div id="nav"></div>
<header class="hero" data-art="Tymna the Weaver" data-credit="cr1" style="height:min(46vh,380px);min-height:300px">
  <div class="hero-txt"><h1>Les joueurs</h1><div class="sub" id="jsub"></div><div class="orn"><i></i><b></b><i></i></div></div>
  <span class="credit" id="cr1"></span>
  <svg class="tear"></svg>
</header>
<main class="wrap">
  <div class="filtres">
    <input id="q" type="search" placeholder="Chercher un prénom" aria-label="Chercher un prénom">
    <select id="fg" aria-label="Groupe"><option value="">Tous les groupes</option></select>
    <select id="fs" aria-label="Style de jeu"><option value="">Tous les styles</option></select>
    <select id="fe" aria-label="État du profil"><option value="">Tous les profils</option><option value="fait">Profil publié</option><option value="attente">Quiz à faire</option><option value="libre">Profil libre</option></select>
  </div>
  <div class="coulf" id="fc"><small>Couleur dominante :</small></div>
  <p class="compte" id="compte" aria-live="polite"></p>
  <div class="cards" id="cards"></div>
  <div style="height:60px"></div>
</main>
<footer><span class="logo">Le grand quiz Commander</span>Contenu de fan non officiel · Illustrations et données : Scryfall · Combos : Commander Spellbook · ©Wizards of the Coast LLC</footer>

<script src="site/i18n.js"></script><script src="site/en.js"></script>
<script src="moteur/reglages.js"></script><script src="moteur/questions.js"></script><script src="moteur/mesure.js"></script><script src="moteur/match.js"></script><script src="moteur/propositions.js"></script>
<script src="site/config.js"></script><script src="site/stockage.js"></script><script src="site/commun.js"></script>
<script>
(async function () {
  const QC = window.QC, $ = SITE.$, esc = SITE.esc, tr = SITE.T;
  if (!(await SITE.demarrer("Les joueurs"))) return;
  const G = await SITE.groupe(), J = G.joueurs.slice().sort((a, b) => (!!b.reponses - !!a.reponses) || a.pseudo.localeCompare(b.pseudo));
  $("jsub").textContent = tr("{n} JOUEURS · {f} PROFILS PUBLIÉS · {g}", { n: J.length, f: J.filter(j => j.reponses).length, g: tr(SITE.pluriel(G.cercles.length) ? "{n} GROUPES" : "{n} GROUPE", { n: G.cercles.length }) });
  $("fg").innerHTML += G.cercles.map(c => `<option value="${c.id}">${esc(c.nom)}</option>`).join("");
  $("fs").innerHTML += QC.STYLES.slice().sort((a, b) => SITE.NOM_STYLE_COURT[a].localeCompare(SITE.NOM_STYLE_COURT[b])).map(k => `<option value="${k}">${esc(tr("Aime : {s}", { s: SITE.NOM_STYLE_COURT[k] }))}</option>`).join("");
  const couleurs = new Set();
  $("fc").innerHTML += QC.COULEURS.map(c => `<button data-c="${c}" aria-pressed="false" aria-label="${QC.NOMS_COULEURS[c]}" title="${QC.NOMS_COULEURS[c]}"><img src="https://svgs.scryfall.io/card-symbols/${c}.svg" alt=""></button>`).join("");
  $("fc").querySelectorAll("button").forEach(b => b.onclick = () => { const c = b.dataset.c; couleurs.has(c) ? couleurs.delete(c) : couleurs.add(c); b.setAttribute("aria-pressed", couleurs.has(c)); filtrer(); });
  const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  function carte(j) {
    const pr = SITE.profil(j), av = SITE.avatarDe(j), col = SITE.TINT[SITE.dominante(pr && pr.P)][0];
    const chip = pr ? "" : j.reclame ? `<span class="chip">Quiz à faire</span>` : `<span class="chip free">Profil libre</span>`;
    return `<a class="pc${pr ? "" : " empty"}" href="profil.html?j=${j.id}" style="--t:${col}">
      <div class="art" ${av ? `data-art="${esc(av)}"` : ""}>${av ? "" : `<span class="bigini" aria-hidden="true">${esc(j.pseudo[0])}</span>`}<div class="mh">${SITE.hex(pr && pr.P.couleurs.dit, pr && pr.P.couleurs.afficheRevele, { color: col, question: !pr })}</div></div>
      <div class="body"><b>${esc(j.pseudo)}</b><div class="t">${pr ? esc(pr.titre + " · " + (SITE.GUILDES[pr.ident] || pr.ident)) : chip}</div>
      <div class="groupes">${SITE.cerclesDe(j).map(c => `<span class="chipg">${esc(c.nom)}</span>`).join("")}</div>
      <div class="phare"><time>${pr ? tr("Profil mis à jour {d}", { d: SITE.depuis(j.maj) }) : tr(j.reclame ? "Réclamé, en attente du quiz" : "En attente de son propriétaire")}</time></div></div></a>`;
  }
  function filtrer() {
    const q = norm($("q").value.trim()), g = $("fg").value, s = $("fs").value, e = $("fe").value;
    const l = J.filter(j => {
      if (q && !norm(j.pseudo).includes(q)) return false;
      if (g && !(j.cercles || []).includes(g)) return false;
      if (e === "fait" && !j.reponses) return false; if (e === "attente" && (j.reponses || !j.reclame)) return false; if (e === "libre" && j.reclame) return false;
      const pr = SITE.profil(j);
      if (s && !(pr && pr.P.styles[s] > .25)) return false;
      if (couleurs.size && !(pr && [...couleurs].some(c => SITE.dominante(pr.P) === c || pr.P.couleurs.final[c] >= .62))) return false;
      return true;
    });
    $("compte").textContent = l.length === J.length ? tr("{n} joueurs", { n: J.length }) : tr(SITE.pluriel(l.length) ? "{n} joueurs sur {t}" : "{n} joueur sur {t}", { n: l.length, t: J.length });
    $("cards").innerHTML = l.map(carte).join("") || `<p class="ph" style="grid-column:1/-1;text-align:center">Personne ne correspond à ces filtres.</p>`;
    SITE.images($("cards"));
  }
  ["q", "fg", "fs", "fe"].forEach(id => $(id).oninput = $(id).onchange = filtrer);
  filtrer(); SITE.images();
})();
</script>
</body>
</html>
